    <script>
      (function() {
        // Prevent "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        // caused when browser extensions or interceptors attempt to assign to window.fetch
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = nativeFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(newFetch) {
              customFetch = typeof newFetch === 'function' ? newFetch : nativeFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch ? Window.prototype.fetch.bind(window) : undefined;
            var customProtoFetch = protoFetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return customProtoFetch;
              },
              set: function(newFetch) {
                customProtoFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        // Filter out errors originating from browser extensions (e.g. chrome-extension://, moz-extension://)
        window.addEventListener('error', function(event) {
          if (
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
             event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
