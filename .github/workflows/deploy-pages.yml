name: Deploy Society OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite application
        run: npm run build

      - name: Verify built entrypoint
        run: test -f dist/index.html && grep -q '/SocietyOS-Inspector/assets/' dist/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deactivate stale GitHub Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentSha = context.sha;
            const cutoff = Date.now() - 10 * 60 * 1000;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: 'github-pages',
              per_page: 100,
            });

            for (const deployment of deployments) {
              if (deployment.sha === currentSha) continue;
              if (new Date(deployment.created_at).getTime() > cutoff) continue;

              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 10,
              });
              const latest = statuses[0];
              if (!latest || !['in_progress', 'queued', 'pending'].includes(latest.state)) continue;

              core.warning(`Deactivating stale Pages deployment ${deployment.id} for ${deployment.sha} (latest status: ${latest.state}).`);
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: `Stale deployment deactivated before deploying ${currentSha.slice(0, 7)}.`,
              });
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
