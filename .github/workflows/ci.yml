name: Build and Typecheck

on:
  push:
    branches:
      - main
      - feat/fy2018-supabase-import
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Test FY2018 import batch validation
        run: node --experimental-strip-types --test supabase/functions/import-fy2018-workbook/batchProgress.test.mjs
